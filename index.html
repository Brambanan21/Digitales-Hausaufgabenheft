<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hausaufgabenheft</title>
<meta name="description" content="Digitales Hausaufgabenheft">
<meta name="theme-color" content="#f6f8fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12161e" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hausaufgaben">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&display=swap">
<style>
/* Layout: a single-column school notebook, bottom tab bar with a raised plus. Subject colours follow the classic German Heftumschlag convention. */
:root{
  --paper:#f6f8fb; --sheet:#ffffff; --grid:#c9d2e0; --ink:#1d2433; --muted:#5d6779; --line:#d5dce7;
  --accent:#2f5fd0; --accent-ink:#ffffff; --danger:#c43a3a; --ok:#2d8a57;
  --display:"Manrope", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Manrope", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#12161e; --sheet:#1a202b; --grid:#2b3442; --ink:#e8ecf3; --muted:#9aa4b6; --line:#2c3443;
  --accent:#7ea2ff; --accent-ink:#0f1522; --danger:#f07b7b; --ok:#6fd39c; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#12161e; --sheet:#1a202b; --grid:#2b3442; --ink:#e8ecf3; --muted:#9aa4b6; --line:#2c3443;
  --accent:#7ea2ff; --accent-ink:#0f1522; --danger:#f07b7b; --ok:#6fd39c; color-scheme:dark}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(20px + env(safe-area-inset-top,0px)) calc(110px + env(safe-area-inset-bottom,0px))}
header.top{display:flex;align-items:center;gap:10px;margin-bottom:18px;min-height:44px}
.back{border:0;background:var(--sheet);border:1px solid var(--line);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
h1{font-family:var(--display);font-weight:500;font-size:1.8rem;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.02em}
.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.stack{display:flex;flex-direction:column;gap:10px}
.group-label{margin:18px 0 8px;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;display:flex;justify-content:space-between}
.group-label:first-child{margin-top:0}
.task{display:flex;align-items:stretch;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.task .spine{width:8px;background:var(--c);flex:none}
.task .check{border:0;background:none;padding:0 6px 0 12px;display:grid;place-items:center;flex:none}
.box{width:24px;height:24px;border:2px solid var(--muted);border-radius:7px;display:grid;place-items:center}
.task.done .box{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.task .main{flex:1;min-width:0;border:0;background:none;text-align:left;padding:12px 14px 12px 6px;display:flex;flex-direction:column;gap:3px}
.task .title{font-weight:500;overflow-wrap:anywhere}
.task.done .title{text-decoration:line-through;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:.85rem;color:var(--muted);align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:600;padding:2px 10px 2px 8px;border-radius:999px;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--ink);border:0}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.due.over{color:var(--danger);font-weight:600}
.due.soon{color:var(--ink);font-weight:600}
.subjects{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.subject{position:relative;border:0;background:var(--c);color:#fff;border-radius:12px;padding:12px 12px 10px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:10px;min-height:84px}
.subject .name{font-weight:600;font-size:1rem;line-height:1.2;overflow-wrap:anywhere}
.subject .count{font-size:.78rem;opacity:.9}
.subject .sel{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;border:2px solid #fff;display:grid;place-items:center}
.subject[aria-pressed="true"] .sel{background:#fff;color:var(--c)}
.subjects.selecting .subject[aria-pressed="false"]{opacity:.55}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;padding:6px 2px;font-size:.92rem}
.inline-add{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px}
.inline-add .input{flex:1;min-width:160px;padding:8px 10px}
.swatches.sm button{width:24px;height:24px;border-width:2px}
.btn.sm{padding:7px 12px;font-size:.9rem}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.detail-row{display:flex;flex-direction:column;gap:4px;padding:12px 0;border-top:1px solid var(--line)}
.detail-row:first-child{border-top:0;padding-top:0}
.detail-text{white-space:pre-wrap;overflow-wrap:anywhere}
.name-edit{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.name-edit input{font-family:var(--display);font-weight:500;font-size:1.8rem;line-height:1.15;letter-spacing:-.02em;border:0;background:none;padding:0;min-width:0;width:100%;border-radius:0}
.name-edit input:focus{outline:0}
.st-list{display:flex;flex-direction:column;margin-top:2px}
.st{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);min-height:44px}
.st:last-child{border-bottom:0}
.st input{flex:1;min-width:0;border:0;background:none;padding:8px 0;outline-offset:0}
.st.done .st-text{text-decoration:line-through;color:var(--muted)}
.st-new::placeholder{color:var(--accent);opacity:1}
.circ{width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);background:none;display:grid;place-items:center;padding:0;flex:none;color:var(--sheet)}
.st.done .circ{background:var(--ok);border-color:var(--ok)}
.btn{border:1px solid var(--line);background:var(--sheet);border-radius:12px;padding:11px 16px;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.empty{text-align:center;padding:32px 16px;color:var(--muted);background:var(--sheet);border:1px dashed var(--line);border-radius:var(--r)}
.empty strong{display:block;color:var(--ink);font-family:var(--display);font-size:1.2rem;margin-bottom:4px}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.9rem}
.input{width:100%;border:1px solid var(--line);background:var(--sheet);border-radius:12px;padding:11px 12px;font-weight:400}
textarea.input{min-height:96px;resize:vertical}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 12px;font-size:.85rem}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick button{border:2px solid transparent;border-radius:999px;padding:6px 12px 6px 10px;background:color-mix(in srgb,var(--c) 16%,var(--sheet));font-weight:600;display:inline-flex;gap:6px;align-items:center}
.pick button::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c)}
.pick button[aria-pressed="true"]{border-color:var(--c)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:34px;height:34px;border-radius:50%;background:var(--c);border:3px solid var(--sheet);box-shadow:0 0 0 1px var(--line)}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--sheet);border-top:1px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:5}
nav.tabs .in{max-width:420px;margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.78rem;font-weight:600;color:var(--muted);padding:6px}
.tab[aria-current="page"]{color:var(--accent)}
.plus{width:60px;height:60px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-top:-30px;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 40%,transparent)}
.sub{color:var(--muted);margin:4px 0 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-weight:600;font-size:.9rem;z-index:9;display:flex;align-items:center;gap:12px;max-width:calc(100vw - 32px)}
.toast button{border:0;background:none;color:var(--accent);font-weight:700;padding:0;filter:brightness(1.3)}
.rep{display:inline-flex;align-items:center;gap:3px}
select.input{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.note{font-size:.8rem;color:var(--muted);text-align:center;margin-top:24px}
.confirm{display:flex;flex-direction:column;gap:10px;padding:12px;border:1px solid var(--danger);border-radius:12px}
@media (prefers-reduced-motion:no-preference){.task,.subject{transition:transform .12s}.task:active,.subject:active{transform:scale(.99)}}

.login{max-width:380px;margin:8vh auto 0;display:flex;flex-direction:column;gap:14px}
.login .logo{width:72px;height:72px;border-radius:18px}
.login .err{color:var(--danger);font-size:.92rem;min-height:1.2em}
.login .btn{width:100%}
.foot{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.offline{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--sheet);border:1px solid var(--line);color:var(--muted);font-size:.8rem;font-weight:600;padding:4px 12px;border-radius:999px;z-index:6}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="tabs" id="tabs" aria-label="Navigation" hidden><div class="in">
  <button class="tab" id="tab-home"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
  <button class="plus" id="tab-add" aria-label="Neue Aufgabe"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="tab" id="tab-subjects"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5M8 7h6"/></svg>Fächer</button>
</div></nav>
<div class="toast" id="toast" hidden></div>

<div class="offline" id="offline" hidden>Offline · wird später synchronisiert</div>

<script type="module">
import { firebaseConfig } from "./firebase-config.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, onSnapshot, setDoc, deleteDoc, getDocFromServer } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const configured=!!(firebaseConfig&&firebaseConfig.apiKey&&!/HIER/.test(firebaseConfig.apiKey));
let auth=null,db=null;
if(configured){
  const app=initializeApp(firebaseConfig);
  auth=getAuth(app);
  db=initializeFirestore(app,{ignoreUndefinedProperties:true,localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});
}

const COLORS=["#2f6fd6","#d23b3b","#2f9a5a","#e0a21b","#8a4fd0","#e0672a","#1f9aa8","#c2468a","#6b7280"];
const DEFAULTS=[["Mathematik","#2f6fd6"],["Deutsch","#d23b3b"],["Sachunterricht","#2f9a5a"]];
const S={tasks:[],subjects:[],ready:false,stack:[{v:"home"}],draft:null,confirm:null,selecting:false,selected:new Set(),adding:false,showDone:false,user:null,login:{mode:"login",err:"",info:""}};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ---------- Datum ---------- */
const iso=d=>{const z=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate())};
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const parse=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(n)=>{const d=today();d.setDate(d.getDate()+n);return iso(d)};
function dueInfo(s){
  if(!s)return{t:"ohne Frist",c:""};
  const diff=Math.round((parse(s)-today())/864e5);
  const long=parse(s).toLocaleDateString("de-DE",{weekday:"short",day:"numeric",month:"short"});
  if(diff<0)return{t:diff===-1?"seit gestern fällig":`seit ${-diff} Tagen fällig`,c:"over"};
  if(diff===0)return{t:"heute fällig",c:"soon"};
  if(diff===1)return{t:"bis morgen",c:"soon"};
  return{t:"bis "+long,c:diff<=3?"soon":""};
}
const REPEATS=[[0,"Keine"],[7,"Jede Woche"],[14,"Alle 2 Wochen"]];
const repName=n=>n===7?"wöchentlich":n===14?"alle 2 Wochen":"";
const repIcon='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg>';
// Nächster Termin einer wiederholten Aufgabe: Frist + Intervall, mindestens ab morgen
function nextDue(due,step){const d=parse(due),t=today();do d.setDate(d.getDate()+step);while(d<=t);return iso(d)}
const byDue=(a,b)=>(a.due||"9999").localeCompare(b.due||"9999")||(a.createdAt||0)-(b.createdAt||0);

/* ---------- Speicher: Firebase (Firestore, offline-fähig) ---------- */
const store={
  unsubs:[],
  start(uidUser){
    this.stop();
    S.tasks=[];S.subjects=[];S.ready=false;S.stack=[{v:"home"}];render();
    const userDoc=doc(db,"users",uidUser);
    this.userDoc=userDoc;
    this.tasksCol=collection(userDoc,"tasks");this.subjCol=collection(userDoc,"faecher");
    let a=false,b=false;
    const ready=()=>{if(a&&b&&!S.ready){S.ready=true;render();this.seed()}};
    const fail=err=>{console.error(err);toast("Daten konnten nicht geladen werden")};
    this.unsubs.push(onSnapshot(this.tasksCol,snap=>{S.tasks=snap.docs.map(d=>({id:d.id,...d.data()}));a=true;ready();if(S.ready)render()},fail));
    this.unsubs.push(onSnapshot(this.subjCol,snap=>{S.subjects=snap.docs.map(d=>({id:d.id,...d.data()}));b=true;ready();if(S.ready)render()},fail));
  },
  stop(){this.unsubs.forEach(u=>u());this.unsubs=[]},
  async seed(){ // Standardfächer nur beim allerersten Start des Kontos
    try{
      const snap=await getDocFromServer(this.userDoc);
      if(snap.exists())return;
      for(const[n,c]of DEFAULTS)this.saveSubject({id:uid(),name:n,color:c});
      this.write(setDoc(this.userDoc,{angelegt:Date.now()}));
    }catch(e){/* offline: beim nächsten Start erneut */}
  },
  // Schreibvorgänge nicht abwarten: offline bestätigt der Server erst später,
  // die Anzeige aktualisiert sich trotzdem sofort aus dem lokalen Speicher.
  write(p){p.catch(err=>{console.error(err);toast("Konnte nicht speichern")});return Promise.resolve()},
  saveTask(t){const{id,...rest}=t;return this.write(setDoc(doc(this.tasksCol,id),rest))},
  delTask(id){return this.write(deleteDoc(doc(this.tasksCol,id)))},
  saveSubject(s){const{id,...rest}=s;return this.write(setDoc(doc(this.subjCol,id),rest))},
  delSubject(id){return this.write(deleteDoc(doc(this.subjCol,id)))},
};

/* ---------- Navigation ---------- */
const cur=()=>S.stack[S.stack.length-1];
function go(v,p={},reset=false){S.confirm=null;S.selecting=false;S.selected.clear();S.adding=false;S.showDone=false;S.newSub="";if(reset)S.stack=[{v,...p}];else S.stack.push({v,...p});if(v==="add")startDraft(p);render();scrollTo(0,0)}
function back(){S.confirm=null;if(S.stack.length>1)S.stack.pop();render();scrollTo(0,0)}
function toast(t,undo){const el=$("#toast");toast.undo=undo||null;el.innerHTML=esc(t)+(undo?'<button data-undo>Rückgängig</button>':"");el.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>{el.hidden=true;toast.undo=null},undo?5000:1800)}
const subj=id=>S.subjects.find(s=>s.id===id)||{name:"Ohne Fach",color:"#6b7280"};

/* ---------- Bausteine ---------- */
function taskItem(t,showSubject=true){
  const s=subj(t.subjectId),d=dueInfo(t.due);
  return `<div class="task ${t.done?"done":""}" style="--c:${esc(s.color)}">
    <span class="spine"></span>
    <button class="check" data-toggle="${t.id}" aria-label="${t.done?"Als offen markieren":t.repeat?"Für diesmal erledigt":"Als erledigt markieren"}"><span class="box">${t.done?'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>':""}</span></button>
    <button class="main" data-open="${t.id}"><span class="title">${esc(t.title)}</span>
      <span class="meta">${showSubject?`<span class="chip" style="--c:${esc(s.color)}">${esc(s.name)}</span>`:""}<span class="due ${t.done?"":d.c}">${t.done?"erledigt":d.t}</span>${t.repeat?`<span class="rep">${repIcon}${repName(t.repeat)}</span>`:""}${t.subtasks&&t.subtasks.length?`<span>${t.subtasks.filter(x=>x.done).length}/${t.subtasks.length} Unteraufgaben</span>`:""}</span>
    </button></div>`;
}
function grouped(list){
  const g={over:[],today:[],week:[],later:[],none:[]};
  const t=iso(today()),w=addDays(7);
  for(const x of list){if(!x.due)g.none.push(x);else if(x.due<t)g.over.push(x);else if(x.due===t)g.today.push(x);else if(x.due<=w)g.week.push(x);else g.later.push(x)}
  const names={over:"Überfällig",today:"Heute",week:"Nächste 7 Tage",later:"Später",none:"Ohne Frist"};
  return Object.keys(g).filter(k=>g[k].length).map(k=>`<div class="group-label"><span>${names[k]}</span><span>${g[k].length}</span></div><div class="stack">${g[k].map(x=>taskItem(x)).join("")}</div>`).join("");
}
const backBtn=`<button class="back" data-back aria-label="Zurück"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>`;

/* ---------- Ansichten ---------- */
const views={
  login(){
    const L=S.login,reg=L.mode==="register";
    return `<form class="login" id="loginForm">
      <img class="logo" src="icons/icon-192.png" alt="">
      <h1>${reg?"Konto erstellen":"Hausaufgabenheft"}</h1>
      <p class="sub" style="margin:0">${reg?"Lege dein Konto einmal an. Mit denselben Daten meldest du dich dann auf allen Geräten an.":"Melde dich an, um deine Aufgaben zu sehen."}</p>
      <label class="f" for="le">E-Mail<input class="input" type="email" id="le" autocomplete="email" required></label>
      <label class="f" for="lp">Passwort<input class="input" type="password" id="lp" autocomplete="${reg?"new-password":"current-password"}" minlength="6" required></label>
      <div class="err" role="alert">${esc(L.err)}</div>${L.info?`<div class="sub" style="margin:0">${esc(L.info)}</div>`:""}
      <button class="btn primary">${reg?"Konto erstellen":"Anmelden"}</button>
      <div class="row" style="justify-content:space-between">
        <button type="button" class="linkbtn" data-loginmode="${reg?"login":"register"}">${reg?"Ich habe schon ein Konto":"Neues Konto erstellen"}</button>
        ${reg?"":`<button type="button" class="linkbtn" data-reset>Passwort vergessen?</button>`}
      </div></form>`;
  },
  setup(){
    return `<div class="login"><img class="logo" src="icons/icon-192.png" alt=""><h1>Noch nicht eingerichtet</h1>
      <p class="sub">In der Datei <b>firebase-config.js</b> fehlen noch die Firebase-Zugangsdaten. Die Anleitung erklärt, woher sie kommen.</p></div>`;
  },
  home(){
    const open=S.tasks.filter(t=>!t.done).sort(byDue);
    const dl=today().toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"});
    return `<header class="top"><div><div class="eyebrow">${esc(dl)}</div><h1>Offene Aufgaben</h1></div></header>
      ${open.length?grouped(open):`<div class="empty"><strong>Alles erledigt</strong>Tippe auf das Plus, um eine neue Aufgabe einzutragen.</div>`}`;
  },
  subjects(){
    const sel=S.selecting, list=S.subjects.slice().sort((a,b)=>a.name.localeCompare(b.name,"de"));
    const nSel=S.selected.size;
    const tasksIn=[...S.selected].reduce((n,id)=>n+S.tasks.filter(t=>t.subjectId===id).length,0);
    return `<header class="top" style="justify-content:space-between"><h1>Fächer</h1>
        ${list.length?`<button class="linkbtn" data-selmode>${sel?"Fertig":"Auswählen"}</button>`:""}</header>
      <div class="subjects ${sel?"selecting":""}">${list.map(s=>{
        const n=S.tasks.filter(t=>t.subjectId===s.id&&!t.done).length;
        return `<button class="subject" data-subject="${s.id}" style="--c:${esc(s.color)}" ${sel?`aria-pressed="${S.selected.has(s.id)}"`:""}>
          <span class="name">${esc(s.name)}</span><span class="count">${n===0?"nichts offen":n+" offen"}</span>
          ${sel?`<span class="sel">${S.selected.has(s.id)?'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>':""}</span>`:""}</button>`}).join("")}</div>
      ${sel?`<div style="margin-top:14px">${S.confirm==="subj"&&nSel?`<div class="confirm"><span>${nSel===1?"1 Fach":nSel+" Fächer"} und ${tasksIn===1?"1 Aufgabe":tasksIn+" Aufgaben"} darin löschen?</span><div class="row"><button class="btn danger sm" data-delsel>Ja, löschen</button><button class="btn sm" data-cancel>Abbrechen</button></div></div>`
        :`<button class="btn danger sm" data-ask="subj" ${nSel?"":"disabled"}>${nSel?`${nSel} löschen`:"Fächer antippen zum Auswählen"}</button>`}</div>`
      :S.adding?`<form class="inline-add" id="newSubject">
          <input class="input" id="sn" required maxlength="40" placeholder="Name, z. B. Englisch" aria-label="Name des Fachs">
          <div class="swatches sm" id="sw">${COLORS.map((c,i)=>`<button type="button" style="--c:${c}" data-color="${c}" aria-label="Farbe ${i+1}" aria-pressed="${i===S.subjects.length%COLORS.length}"></button>`).join("")}</div>
          <button class="btn primary sm">Anlegen</button><button type="button" class="btn sm" data-addsubj="0">Abbrechen</button></form>`
      :`<div style="margin-top:10px"><button class="linkbtn" data-addsubj="1">+ Fach hinzufügen</button></div>`}
      <div class="foot"><span>Angemeldet als ${esc(S.user&&S.user.email)}</span><button class="linkbtn" data-logout>Abmelden</button></div>`;
  },
  subject(p){
    const s=S.subjects.find(x=>x.id===p.id); if(!s)return views.subjects();
    const all=S.tasks.filter(t=>t.subjectId===s.id);
    const open=all.filter(t=>!t.done).sort(byDue), done=all.filter(t=>t.done).sort(byDue).reverse();
    return `<header class="top">${backBtn}<label class="name-edit"><input id="subjname" data-sid="${s.id}" value="${esc(s.name)}" maxlength="40" aria-label="Name des Fachs ändern" enterkeyhint="done"></label></header>
      <div class="group-label"><span>Offen</span><span>${open.length}</span></div>
      ${open.length?`<div class="stack">${open.map(t=>taskItem(t,false)).join("")}</div>`:`<div class="empty">Keine offenen Aufgaben in diesem Fach.</div>`}
      ${done.length?`<div style="margin-top:16px"><button class="linkbtn" data-showdone aria-expanded="${S.showDone}">${S.showDone?"Erledigte ausblenden":`Erledigte anzeigen (${done.length})`}</button></div>${S.showDone?`<div class="stack" style="margin-top:8px">${done.map(t=>taskItem(t,false)).join("")}</div>`:""}`:""}`;
  },
  task(p){
    const t=S.tasks.find(x=>x.id===p.id); if(!t)return views.home();
    const s=subj(t.subjectId),d=dueInfo(t.due),subs=t.subtasks||[];
    const tick='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>';
    const full=t.due?parse(t.due).toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long",year:"numeric"}):"Keine Frist";
    return `<header class="top">${backBtn}<div class="eyebrow">Aufgabe</div></header>
      <h1 style="margin-bottom:16px;overflow-wrap:anywhere">${esc(t.title)}</h1>
      <div class="card">
        <div class="detail-row"><span class="eyebrow">Fach</span><div><button class="chip" style="--c:${esc(s.color)};font-size:.95rem;padding:6px 14px 6px 10px" data-subject="${esc(t.subjectId)}">${esc(s.name)} · alle Aufgaben ansehen ›</button></div></div>
        <div class="detail-row"><span class="eyebrow">Frist</span><span>${esc(full)} <span class="due ${t.done?"":d.c}">(${t.done?"erledigt":d.t})</span></span></div>
        ${t.repeat?`<div class="detail-row"><span class="eyebrow">Wiederholung</span><span class="rep">${repIcon} ${t.repeat===7?"Jede Woche":"Alle 2 Wochen"} · nach dem Abhaken erscheint sie wieder</span></div>`:""}
        <div class="detail-row"><span class="eyebrow">Details</span><span class="detail-text">${t.details?esc(t.details):'<span style="color:var(--muted)">Keine Details</span>'}</span></div>
        <div class="detail-row"><span class="eyebrow">Unteraufgaben${subs.length?` · ${subs.filter(x=>x.done).length}/${subs.length}`:""}</span>
          <div class="st-list">${subs.map(x=>`<div class="st ${x.done?"done":""}"><input class="st-text" id="st-${x.id}" data-task="${t.id}" data-sub="${x.id}" value="${esc(x.text)}" aria-label="Unteraufgabe"><button class="circ" data-subtoggle="${t.id}:${x.id}" aria-label="${x.done?"Wieder öffnen":"Abhaken"}">${x.done?tick:""}</button></div>`).join("")}
          <div class="st"><input id="newsub" class="st-new" data-task="${t.id}" value="${esc(S.newSub||"")}" placeholder="+ Unteraufgabe hinzufügen" aria-label="Neue Unteraufgabe" enterkeyhint="done"></div></div></div>
      </div>
      <div class="row" style="margin-top:16px">
        <button class="btn primary" data-toggle="${t.id}">${t.done?"Wieder öffnen":t.repeat?"Für diesmal erledigt":"Als erledigt markieren"}</button>
        <button class="btn" data-edit="${t.id}">Bearbeiten</button>
        ${S.confirm==="task"?`<button class="btn danger" data-deltask="${t.id}">Wirklich löschen</button><button class="btn" data-cancel>Abbrechen</button>`:`<button class="btn danger" data-ask="task">Löschen</button>`}
      </div>`;
  },
  add(){
    const d=S.draft;
    return `<header class="top">${backBtn}<div><h1>${d.id?"Aufgabe bearbeiten":"Neue Aufgabe"}</h1></div></header>
      <form class="card stack" id="taskForm" style="gap:16px">
        <label class="f" for="ft">Titel<input class="input" id="ft" required maxlength="120" value="${esc(d.title)}" placeholder="z. B. Arbeitsblatt Seite 12"></label>
        <label class="f" for="fd">Details<textarea class="input" id="fd" placeholder="Was genau ist zu tun? Material, Seitenzahlen …">${esc(d.details)}</textarea></label>
        <div class="f"><label for="fdue">Frist</label><input class="input" type="date" id="fdue" value="${esc(d.due)}">
          <div class="quick"><button type="button" data-quick="none">Keine Frist</button></div></div>
        <label class="f" for="frep">Wiederholung<select class="input" id="frep">${REPEATS.map(([n,l])=>`<option value="${n}" ${(+d.repeat||0)===n?"selected":""}>${l}</option>`).join("")}</select>
          <span class="sub" style="margin:0;font-weight:400;font-size:.85rem">Nach dem Abhaken springt die Frist automatisch zum nächsten Termin.</span></label>
        <div class="f">Fach<div class="pick" id="pick">${S.subjects.map(s=>`<button type="button" style="--c:${esc(s.color)}" data-pick="${s.id}" aria-pressed="${d.subjectId===s.id}">${esc(s.name)}</button>`).join("")||'<span class="sub">Lege zuerst unter „Fächer“ ein Fach an.</span>'}</div></div>
        <div class="row"><button class="btn primary">${d.id?"Speichern":"Aufgabe eintragen"}</button><button type="button" class="btn" data-back>Abbrechen</button></div>
      </form>`;
  }
};
function startDraft(p){
  if(p.edit){const t=S.tasks.find(x=>x.id===p.edit);S.draft={...t};return}
  S.draft={id:null,title:"",details:"",due:addDays(1),repeat:0,subjectId:p.subjectId||(S.subjects[0]&&S.subjects[0].id)||""};
}

function render(){
  if(!S.user||!configured){$("#tabs").hidden=true;$("#app").innerHTML=configured?views.login():views.setup();return}
  $("#tabs").hidden=false;
  const c=cur();
  if(!S.ready){$("#app").innerHTML=`<div class="empty" style="margin-top:40px"><strong>Hausaufgabenheft wird geöffnet …</strong></div>`;return}
  if(c.v==="add"){ // Eingaben beim Neuzeichnen behalten
    const f=$("#taskForm"); if(f){S.draft.title=$("#ft").value;S.draft.details=$("#fd").value;S.draft.due=$("#fdue").value;S.draft.repeat=+$("#frep").value}
  }
  const ns=$("#newsub");if(ns)S.newSub=ns.value;
  const ae=document.activeElement,fid=ae&&ae.id,val=ae&&ae.tagName==="INPUT"?ae.value:null,sel=val!=null?[ae.selectionStart,ae.selectionEnd]:null;
  $("#app").innerHTML=views[c.v](c);
  if(fid){const n=document.getElementById(fid);if(n&&n!==ae){if(val!=null)n.value=val;n.focus();if(sel)try{n.setSelectionRange(...sel)}catch(e){}}}
  const root=S.stack[0].v;
  $("#tab-home").setAttribute("aria-current",root==="home"&&c.v!=="add"?"page":"false");
  $("#tab-subjects").setAttribute("aria-current",root==="subjects"&&c.v!=="add"?"page":"false");
}

/* ---------- Ereignisse ---------- */
document.addEventListener("click",async e=>{
  const b=e.target.closest("button");if(!b)return;const ds=b.dataset;
  if(ds.loginmode){S.login={mode:ds.loginmode,err:"",info:""};return render()}
  if("reset" in ds){const em=$("#le").value.trim();if(!em){S.login.err="Bitte zuerst die E-Mail-Adresse eintragen.";return render()}
    try{await sendPasswordResetEmail(auth,em);S.login={mode:"login",err:"",info:"Wir haben dir eine E-Mail zum Zurücksetzen des Passworts geschickt."}}catch(err){S.login.err=authMsg(err)}
    render();const le=$("#le");if(le)le.value=em;return}
  if("logout" in ds){store.stop();await signOut(auth);return}
  if(b.id==="tab-home")return go("home",{},true);
  if(b.id==="tab-subjects")return go("subjects",{},true);
  if(b.id==="tab-add")return go("add");
  if("back" in ds)return back();
  if(ds.open)return go("task",{id:ds.open});
  if("showdone" in ds){S.showDone=!S.showDone;return render()}
  if("selmode" in ds){S.selecting=!S.selecting;S.selected.clear();S.confirm=null;S.adding=false;return render()}
  if(ds.subject&&S.selecting&&cur().v==="subjects"){S.selected.has(ds.subject)?S.selected.delete(ds.subject):S.selected.add(ds.subject);S.confirm=null;return render()}
  if(ds.subject)return go("subject",{id:ds.subject});
  if(ds.addsubj){S.adding=ds.addsubj==="1";render();if(S.adding)$("#sn").focus();return}
  if("delsel" in ds){const ids=[...S.selected];for(const id of ids){for(const t of S.tasks.filter(t=>t.subjectId===id))await store.delTask(t.id).catch(()=>{});await store.delSubject(id).catch(()=>{})}
    S.selected.clear();S.selecting=false;S.confirm=null;render();toast(ids.length===1?"Fach gelöscht":"Fächer gelöscht");return}
  if(ds.addin)return go("add",{subjectId:ds.addin});
  if(ds.edit)return go("add",{edit:ds.edit});
  if(ds.ask){S.confirm=ds.ask;return render()}
  if("cancel" in ds){S.confirm=null;return render()}
  if(ds.subtoggle){const[tid,sid]=ds.subtoggle.split(":");updateSubs(tid,l=>l.map(x=>x.id===sid?{...x,done:!x.done}:x));return}
  if(ds.toggle){const t=S.tasks.find(x=>x.id===ds.toggle);if(!t)return;
    if(t.repeat&&!t.done&&t.due){ // wiederholte Aufgabe: nicht abschließen, sondern zum nächsten Termin schieben
      const prev={...t},nd=nextDue(t.due,t.repeat);
      await store.saveTask({...t,due:nd,subtasks:(t.subtasks||[]).map(x=>({...x,done:false}))});
      toast("Erledigt · wieder "+parse(nd).toLocaleDateString("de-DE",{weekday:"short",day:"numeric",month:"short"}),()=>store.saveTask(prev));return}
    await store.saveTask({...t,done:!t.done}).catch(()=>toast("Konnte nicht speichern"));toast(t.done?"Wieder offen":"Erledigt");return}
  if(ds.deltask){await store.delTask(ds.deltask).catch(()=>{});S.confirm=null;back();toast("Aufgabe gelöscht");return}
  if(ds.delsubj){const id=ds.delsubj;for(const t of S.tasks.filter(t=>t.subjectId===id))await store.delTask(t.id).catch(()=>{});
    await store.delSubject(id).catch(()=>{});S.confirm=null;go("subjects",{},true);toast("Fach gelöscht");return}
  if(ds.quick){$("#fdue").value=ds.quick==="none"?"":addDays(+ds.quick);if(ds.quick==="none")$("#frep").value="0";return}
  if("undo" in ds){const f=toast.undo;$("#toast").hidden=true;toast.undo=null;if(f)f();return}
  if(ds.pick){S.draft.subjectId=ds.pick;document.querySelectorAll("#pick button").forEach(x=>x.setAttribute("aria-pressed",x===b));return}
  if(ds.color){document.querySelectorAll("#sw button").forEach(x=>x.setAttribute("aria-pressed",x===b));return}
});
document.addEventListener("submit",async e=>{
  e.preventDefault();
  if(e.target.id==="loginForm"){
    const em=$("#le").value.trim(),pw=$("#lp").value,btn=e.target.querySelector(".btn.primary");btn.disabled=true;
    try{S.login.mode==="register"?await createUserWithEmailAndPassword(auth,em,pw):await signInWithEmailAndPassword(auth,em,pw);S.login={mode:"login",err:"",info:""}}
    catch(err){S.login.err=authMsg(err);render();const le=$("#le");if(le)le.value=em}
    return}
  if(e.target.id==="taskForm"){
    const d=S.draft,title=$("#ft").value.trim();if(!title)return;
    if(!d.subjectId&&S.subjects.length){toast("Bitte ein Fach auswählen");return}
    const repeat=+$("#frep").value||0,due=$("#fdue").value;
    if(repeat&&!due){toast("Für eine Wiederholung braucht die Aufgabe eine Frist");return}
    const t={...d,id:d.id||uid(),title,details:$("#fd").value.trim(),due,repeat,done:!!d.done,createdAt:d.createdAt||Date.now()};
    try{await store.saveTask(t)}catch(err){toast("Konnte nicht speichern");return}
    const wasEdit=!!d.id;S.draft=null;S.stack.pop();if(!S.stack.length)S.stack=[{v:"home"}];render();scrollTo(0,0);toast(wasEdit?"Gespeichert":"Aufgabe eingetragen");
  }
  if(e.target.id==="newSubject"){
    const name=$("#sn").value.trim();if(!name)return;
    const c=(document.querySelector('#sw button[aria-pressed="true"]')||{}).dataset?.color||COLORS[0];
    try{await store.saveSubject({id:uid(),name,color:c})}catch(err){toast("Konnte nicht speichern");return}
    S.adding=false;render();toast("Fach angelegt");
  }
});

function updateSubs(tid,fn){const t=S.tasks.find(x=>x.id===tid);if(!t)return;
  return store.saveTask({...t,subtasks:fn((t.subtasks||[]).map(x=>({...x})))}).catch(()=>toast("Konnte nicht speichern"))}
document.addEventListener("keydown",e=>{
  if(e.key!=="Enter")return;const el=e.target;
  if(el.id==="newsub"){e.preventDefault();const v=el.value.trim();if(!v)return;el.value="";S.newSub="";updateSubs(el.dataset.task,l=>[...l,{id:uid(),text:v,done:false}])}
  else if(el.id==="subjname"||(el.classList&&el.classList.contains("st-text"))){e.preventDefault();el.blur()}
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.id==="subjname"){const s=S.subjects.find(x=>x.id===el.dataset.sid);if(!s)return;const v=el.value.trim();
    if(!v||v===s.name){el.value=s.name;return}
    store.saveSubject({...s,name:v}).then(()=>toast("Name geändert")).catch(()=>{el.value=s.name;toast("Konnte nicht speichern")});return}if(!el.classList||!el.classList.contains("st-text"))return;
  const v=el.value.trim(),sid=el.dataset.sub;
  updateSubs(el.dataset.task,l=>v?l.map(x=>x.id===sid?{...x,text:v}:x):l.filter(x=>x.id!==sid));
});

function authMsg(err){
  const c=err&&err.code||"";
  if(c.includes("invalid-credential")||c.includes("wrong-password")||c.includes("user-not-found"))return"E-Mail oder Passwort stimmt nicht.";
  if(c.includes("email-already-in-use"))return"Für diese E-Mail gibt es schon ein Konto. Melde dich stattdessen an.";
  if(c.includes("weak-password"))return"Das Passwort muss mindestens 6 Zeichen haben.";
  if(c.includes("invalid-email"))return"Diese E-Mail-Adresse ist ungültig.";
  if(c.includes("admin-restricted-operation")||c.includes("operation-not-allowed"))return"Neue Konten können für diese App nicht mehr erstellt werden.";
  if(c.includes("too-many-requests"))return"Zu viele Versuche. Bitte warte kurz und versuche es dann erneut.";
  if(c.includes("network-request-failed"))return"Keine Internetverbindung. Für die Anmeldung brauchst du einmal Internet.";
  return"Das hat nicht geklappt ("+c+").";
}
const setOnline=()=>{$("#offline").hidden=navigator.onLine};
addEventListener("online",setOnline);addEventListener("offline",setOnline);setOnline();

render();
if(configured)onAuthStateChanged(auth,user=>{S.user=user;if(user)store.start(user.uid);else{store.stop();S.ready=false;render()}});
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));

</script>
</body>
</html>
